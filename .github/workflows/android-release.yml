name: Android Release (signed)
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        type: choice
        options: [passenger, driver, admin]
      api_url:
        description: Public API base URL, ending in /api
        required: true
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: android-actions/setup-android@v3
      - run: npm install --prefix mobile --no-audit --no-fund
      - run: node mobile/scripts/prepare.js ${{ inputs.app }}
        env:
          MIZARI_API_URL: ${{ inputs.api_url }}
      - run: |
          cd mobile
          npx cap add android
          npx cap sync android
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 --decode > mobile/android/release.keystore
      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: mizari-${{ inputs.app }}-release
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
