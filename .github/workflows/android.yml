name: Build Android APKs
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        required: true
        type: choice
        options: [passenger, driver, admin]
      api_url:
        description: Public API base URL, ending in /api
        required: true
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: android-actions/setup-android@v3
      - run: npm install --prefix mobile --no-audit --no-fund
      - run: node mobile/scripts/prepare.js ${{ inputs.app }}
        env:
          MIZARI_API_URL: ${{ inputs.api_url }}
      - run: |
          cd mobile
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mizari-${{ inputs.app }}-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
