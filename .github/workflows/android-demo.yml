name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [passenger, driver, admin]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install mobile dependencies
        run: npm install --prefix mobile

      - name: Install compatible TypeScript
        run: npm install --prefix mobile --save-dev typescript@5.9.3

      - name: Prepare app
        run: node mobile/scripts/prepare.js ${{ matrix.app }}
        env:
          MIZARI_API_URL: ''

      - name: Create Android project
        run: |
          cd mobile
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
