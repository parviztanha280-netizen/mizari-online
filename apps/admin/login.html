```html
<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>میزاری آنلاین | ورود</title>

  <link rel="stylesheet" href="style.css">

  <!-- config باید قبل از api.js باشد -->
  <script src="config.js"></script>
</head>

<body>

  <main>

    <div class="card">
      <h2>🚕 میزاری آنلاین</h2>
      <h3>ورود به حساب</h3>

      <form id="loginForm">

        <label for="phone">شماره تلفن</label>
        <input
          id="phone"
          type="tel"
          placeholder="شماره تلفن"
          autocomplete="tel"
          required
        >

        <label for="password">رمز عبور</label>
        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginBtn">
          ورود
        </button>

      </form>

      <div id="message"></div>
    </div>

  </main>

  <script src="api.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const phone = document.getElementById("phone");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "در حال ورود...";

      try {

        const result = await API.call("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            phone: phone.value.trim(),
            password: password.value
          })
        });

        if (result.token) {
          localStorage.setItem("mizari_token", result.token);
        }

        location.href = "index.html";

      } catch (e) {

        message.textContent =
          e.message || "ورود ناموفق بود.";

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "ورود";

      }
    });
  </script>

</body>
</html>
```
