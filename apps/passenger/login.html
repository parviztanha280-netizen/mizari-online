<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>میزاری آنلاین</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body><main class="login-page"><div class="logo">🚕</div><h1>میزاری آنلاین</h1><p>راهت، همین‌جا شروع میشه</p><div class="login-box"><label>شماره موبایل افغانستان</label><input id="phone" placeholder="07XXXXXXXX" maxlength="10"><button id="send">دریافت کد</button><div id="otpbox" class="hidden"><label>کد OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"><button id="login">ورود</button></div><p id="msg"></p></div></main><script src="config.js"></script><script src="api.js"></script><script>const $=x=>document.getElementById(x);$("send").onclick=async()=>{try{let d=await API.otp($("phone").value.trim());$("otpbox").classList.remove("hidden");$("msg").textContent=d.demoCode?"کد آزمایشی: "+d.demoCode:"کد ارسال شد"}catch(e){$("msg").textContent=e.message}};$("login").onclick=async()=>{try{let d=await API.verify($("phone").value.trim(),$("otp").value.trim());localStorage.setItem("mizari_token",d.token);location.href="index.html"}catch(e){$("msg").textContent=e.message}};</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script></body></html>
