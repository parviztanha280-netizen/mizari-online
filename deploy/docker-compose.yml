services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env.production
    volumes:
      - mizari-data:/app/data
    ports:
      - "3000:3000"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
volumes:
  mizari-data:
